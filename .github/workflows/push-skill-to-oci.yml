name: Publish skills to OCI registry

# Publishes skill directories to ghcr.io as OCI artifacts, each under its own semver tag
# plus a floating `latest`. Two ways in: called by the release workflow after
# release-please cuts releases, or dispatched by hand.
#
# Why semver + `latest` and no floating `v1`: a major-only tag would duplicate what a
# `^1.0.0` range already computes from the tag list, and it reads like a pin while
# actually moving. `latest` cannot be misread — and diderot already falls back to it when
# a manifest omits `version:`.
on:
  workflow_call:
    inputs:
      paths:
        description: 'JSON array of skill directories to publish, e.g. ["skills/documentation/making-of"]'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      skill_path:
        description: "Path under skills/ (e.g. documentation/making-of). Leave empty for every skill."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # diderot ships native binaries since v0.1.0, so there is nothing to compile: the
      # installer picks the right one and verifies its SHA-256. Publishing a skill
      # therefore exercises that installer on every run.
      - name: Install diderot
        run: |
          curl -fsSL https://raw.githubusercontent.com/sunix/diderot/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: diderot --version

      # Writes ~/.docker/config.json, which diderot's OCI client reads for registry auth.
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish
        env:
          CALLED_PATHS: ${{ inputs.paths }}
          SKILL_PATH: ${{ inputs.skill_path }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"

          # Called by the release workflow: exactly the skills that were just released.
          # Dispatched by hand: one skill, or every directory holding a SKILL.md.
          if [ -n "${CALLED_PATHS:-}" ]; then
            dirs="$(printf '%s' "$CALLED_PATHS" | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)))')"
          elif [ -n "${SKILL_PATH:-}" ]; then
            dirs="skills/${SKILL_PATH}"
          else
            dirs="$(find skills -name SKILL.md -printf '%h\n' | sort)"
          fi

          {
            echo "### Published to \`ghcr.io/$owner/skills\`"
            echo
            echo "| skill | version |"
            echo "|-------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          for dir in $dirs; do
            [ -f "$dir/SKILL.md" ] || { echo "::error::no SKILL.md in $dir"; exit 1; }
            [ -f "$dir/version.txt" ] || { echo "::error::no version.txt in $dir"; exit 1; }
            name="$(basename "$dir")"
            version="$(tr -d '[:space:]' < "$dir/version.txt")"
            repo="ghcr.io/$owner/skills/$name"

            echo "==> $dir -> $repo:$version (and :latest)"
            diderot push "$dir" "$repo:$version"
            diderot push "$dir" "$repo:latest"
            echo "| \`$name\` | \`$version\` |" >> "$GITHUB_STEP_SUMMARY"
          done
